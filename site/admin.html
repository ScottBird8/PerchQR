<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PerchQR Administrator</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
<style>
/* Owner-only gate, deliberately unlisted (no link to this page appears
   anywhere on the public site or in /app) and separate from the shared
   agent sign-in at /app. Signing in here still authenticates against the
   same Supabase Auth user pool as everywhere else — there is no second
   credential system — but this page checks the signed-in user's id
   against PERCHQR_OWNER_ID before granting entry, and immediately signs
   out and rejects anyone else's account, even a valid agent login. */
:root{
  --bg:#EFF0EB;
  --panel:#FFFFFF;
  --maroon:#3B4A5A;
  --maroon-bright:#4E6178;
  --maroon-wash:#E3E7E9;
  --charcoal:#23262B;
  --charcoal-soft:#585F5C;
  --line:#DBDDD5;
  --line-bright:#C7CBC3;
  --display:'Fraunces', serif;
  --body:'Karla', sans-serif;
  --mono:'JetBrains Mono', monospace;
  --radius:10px;
}
body{background:var(--bg);}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.gate-card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:32px;text-align:center;box-shadow:0 20px 45px -22px rgba(35,38,43,0.28);}
.wordmark{font-family:var(--display);font-weight:700;font-size:20px;color:var(--maroon);display:flex;align-items:center;justify-content:center;gap:9px;margin:0 0 6px;}
.wordmark-icon{color:var(--maroon);flex-shrink:0;}
.eyebrow{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--charcoal-soft);margin:0 0 20px;}
h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0 0 18px;}
input{width:100%;padding:11px 14px;border:1px solid var(--line-bright);border-radius:8px;font-family:var(--body);font-size:14px;margin-bottom:10px;background:#fff;color:var(--charcoal);}
button{width:100%;margin-top:6px;font-family:var(--body);font-weight:600;font-size:14.5px;padding:12px;border-radius:6px;border:none;background:var(--maroon);color:#fff;cursor:pointer;}
button:hover{background:var(--maroon-bright);}
button:disabled{opacity:0.6;cursor:default;}
.gate-error{color:var(--maroon);font-size:13px;margin-top:12px;}
.hidden{display:none!important;}

/* Signed-in administrator console (shown in place of the gate). */
.console{max-width:1120px;margin:0 auto;padding:28px 20px 60px;}
.console-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px;}
.console-bar .wordmark{margin:0;justify-content:flex-start;}
.console-bar-actions{display:flex;gap:8px;align-items:center;}
.console h1{font-family:var(--display);font-weight:600;font-size:24px;margin:0 0 4px;}
.console-sub{color:var(--charcoal-soft);font-size:14px;margin:0 0 18px;}
.btn-sm{width:auto;margin:0;padding:7px 13px;font-size:13px;border-radius:6px;border:1px solid var(--line-bright);background:#fff;color:var(--charcoal);text-decoration:none;display:inline-block;cursor:pointer;font-family:var(--body);font-weight:600;}
.btn-sm:hover{background:var(--maroon-wash);}
.btn-sm.primary{background:var(--maroon);color:#fff;border-color:var(--maroon);}
.btn-sm.primary:hover{background:var(--maroon-bright);}
.agent-row{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;}
.agent-line{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.agent-name{font-weight:700;font-size:15px;}
.agent-meta{color:var(--charcoal-soft);font-size:13px;margin-top:2px;}
.agent-url{font-family:var(--mono);font-size:12.5px;margin-top:6px;}
.agent-url a{color:var(--maroon);}
.slug-editor{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
.slug-editor-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.slug-editor-line .prefix{font-family:var(--mono);font-size:13px;color:var(--charcoal-soft);}
.slug-editor input{width:240px;margin:0;font-family:var(--mono);}
.slug-status{font-family:var(--mono);font-size:12px;margin-top:8px;color:var(--charcoal-soft);}
.slug-status.ok{color:#2a7a3b;}
.slug-status.bad{color:#a33;}
.console-note{font-size:12.5px;color:var(--charcoal-soft);margin-top:6px;line-height:1.5;}
.console-msg{background:#E6F2E8;border:1px solid #b9d9bf;color:#1f5c2c;border-radius:8px;padding:10px 14px;font-size:13.5px;margin-bottom:14px;}
.console-msg.err{background:#F8E7E7;border-color:#e3b9b9;color:#8a2a2a;}

.view-tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line);}
.view-tab{width:auto;margin:0 0 -1px;padding:9px 16px;background:none;color:var(--charcoal-soft);border:1px solid transparent;border-radius:6px 6px 0 0;font-size:14px;}
.view-tab:hover{background:none;color:var(--charcoal);}
.view-tab.active{color:var(--maroon);background:var(--panel);border-color:var(--line);border-bottom-color:var(--panel);}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.controls input{width:280px;margin:0;}
select{font-family:var(--body);font-size:14px;padding:9px 12px;border:1px solid var(--line-bright);border-radius:8px;background:#fff;color:var(--charcoal);}
textarea{width:100%;font-family:var(--body);font-size:14px;padding:10px 12px;border:1px solid var(--line-bright);border-radius:8px;background:#fff;color:var(--charcoal);resize:vertical;}
input[type=checkbox]{width:auto;margin:0;}
.segments{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.seg{width:auto;margin:0;padding:6px 12px;font-size:13px;border-radius:100px;background:#fff;color:var(--charcoal);border:1px solid var(--line-bright);}
.seg:hover{background:var(--maroon-wash);}
.seg.active{background:var(--maroon);color:#fff;border-color:var(--maroon);}
.seg .n{opacity:.7;font-weight:500;margin-left:4px;}
.search-note{font-size:12.5px;color:var(--charcoal-soft);margin:0 0 8px;min-height:16px;}
.table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;}
table.users{width:100%;border-collapse:collapse;font-size:13.5px;}
table.users th{text-align:left;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--charcoal-soft);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;}
table.users td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
table.users tr:last-child td{border-bottom:none;}
.u-name{font-weight:700;}
.u-sub{font-family:var(--mono);font-size:11.5px;color:var(--charcoal-soft);}
.badge{display:inline-block;padding:3px 10px;border-radius:100px;font-size:12px;font-weight:600;background:#E9ECEA;color:var(--charcoal);white-space:nowrap;}
.badge.st-active{background:#E6F2E8;color:#1f5c2c;}
.badge.st-pending{background:#FBF1DC;color:#7a5410;}
.badge.st-paused{background:#E4EAF3;color:#2f4a73;}
.badge.st-suspended{background:#F8E7E7;color:#8a2a2a;}
.badge.st-canceled{background:#EDE6E0;color:#5e4632;}
.badge.st-archived{background:#E3E3E3;color:#4a4a4a;}
.empty-row{padding:26px;text-align:center;color:var(--charcoal-soft);font-size:14px;}

.back-link{width:auto;margin:0 0 14px;padding:0;background:none;color:var(--maroon);font-size:13.5px;text-align:left;}
.back-link:hover{background:none;text-decoration:underline;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;}
.card h3{font-family:var(--display);font-weight:600;font-size:16px;margin:0 0 12px;}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 22px;}
.info-grid .k{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--charcoal-soft);}
.info-grid .v{font-size:14px;margin-top:2px;word-break:break-word;}
.ctl-row{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end;}
.ctl label{display:block;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--charcoal-soft);margin-bottom:5px;}
.ctl-check{display:flex;gap:8px;align-items:center;font-size:14px;padding-bottom:9px;}
.list-line{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;flex-wrap:wrap;}
.list-line:last-child{border-bottom:none;}
.list-line a{color:var(--maroon);font-weight:600;}
.hist-what{font-weight:600;}
.hist-when{font-family:var(--mono);font-size:11.5px;color:var(--charcoal-soft);}
.hist-reason{color:var(--charcoal-soft);font-size:12.5px;margin-top:2px;}
.muted{color:var(--charcoal-soft);font-size:13.5px;}

.modal-bg{position:fixed;inset:0;background:rgba(20,22,26,0.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:300;}
.modal{background:#fff;border-radius:12px;max-width:460px;width:100%;padding:24px 26px;box-shadow:0 30px 60px -20px rgba(0,0,0,0.45);}
.modal h3{font-family:var(--display);font-weight:600;font-size:19px;margin:0 0 12px;}
.modal p{font-size:14px;margin:0 0 12px;line-height:1.5;}
.modal .facts{background:var(--bg);border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:12px;line-height:1.7;}
.modal .warn{background:#FBF1DC;border:1px solid #ecd49a;color:#6b4a0c;border-radius:8px;padding:10px 14px;font-size:13.5px;margin-bottom:12px;line-height:1.5;}
.modal .reason-label{font-size:12.5px;color:var(--charcoal-soft);display:block;margin:0 0 5px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--charcoal);color:#fff;padding:11px 20px;border-radius:100px;font-size:13.5px;opacity:0;transition:all .25s;z-index:500;pointer-events:none;max-width:90vw;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.err{background:#8a2a2a;}
.tier-row{display:grid;grid-template-columns:150px 1fr 2fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
.tier-row input{margin:0;}
.tier-key{font-family:var(--mono);font-size:12px;color:var(--charcoal-soft);}
@media (max-width:760px){.tier-row{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="console hidden" id="console">
  <div class="console-bar">
    <div class="wordmark">
      <svg class="wordmark-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3M19 14h2M14 19h2M19 19h2"/></svg>
      PerchQR Administrator
    </div>
    <div class="console-bar-actions">
      <a class="btn-sm" href="/app">User dashboard</a>
      <button class="btn-sm" id="signOutBtn">Sign out</button>
    </div>
  </div>
  <div class="view-tabs">
    <button class="view-tab active" data-view="users">Users</button>
    <button class="view-tab" data-view="todo">To do <span id="todoBadge" class="badge hidden" style="margin-left:4px;background:#fbf1dc;color:#7a5410;"></span></button>
    <button class="view-tab" data-view="tiers">Subscription tiers</button>
  </div>
  <div id="consoleMsg"></div>

  <div id="usersView">
    <div id="listView">
      <h1>Users</h1>
      <p class="console-sub">Everyone who has signed up. Accounts are never deleted &mdash; archive them instead, and restore any time.</p>
      <div class="controls">
        <input id="searchBox" type="search" placeholder="Search by name or email" autocomplete="off">
        <select id="tierFilter"></select>
      </div>
      <div class="segments" id="segments"></div>
      <div class="search-note" id="searchNote"></div>
      <div class="table-wrap">
        <table class="users">
          <thead><tr><th>User</th><th>Email</th><th>Subscription</th><th>Status</th><th>Beta tester</th><th>Date created</th><th>Last activity</th><th>Profile complete</th><th>Actions</th></tr></thead>
          <tbody id="userRows"><tr><td colspan="9" class="empty-row">Loading&hellip;</td></tr></tbody>
        </table>
      </div>
    </div>
    <div id="profileView" class="hidden"></div>
  </div>

  <div id="todoView" class="hidden"></div>
  <div id="tiersView" class="hidden"></div>
</div>

<div id="modalHost"></div>
<div class="toast" id="toast"></div>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="wordmark">
      <svg class="wordmark-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3M19 14h2M14 19h2M19 19h2"/></svg>
      PerchQR
    </div>
    <div class="eyebrow">Administrator</div>
    <h2>Sign in</h2>
    <input id="loginEmail" type="email" placeholder="Email" autocomplete="username">
    <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn">Sign in</button>
    <div class="gate-error hidden" id="loginError"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/supabase-client.js"></script>
<script src="/assets/perch.js"></script>
<script>
// Mirrors the same id used in supabase/schema.sql's is_perchqr_owner() and
// app.html's PERCHQR_OWNER_ID — keep all three in sync if this ever changes.
const PERCHQR_OWNER_ID = '72158799-b0f4-47c9-ac2a-45ffe52db1df';

async function attemptLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errEl.classList.add('hidden');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    if (data.user.id !== PERCHQR_OWNER_ID) {
      await sb.auth.signOut();
      throw new Error('This sign-in is for the PerchQR administrator only.');
    }
    await showConsole();
  } catch (err) {
    errEl.textContent = err.message || 'Sign-in failed.';
    errEl.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Sign in';
  }
}

document.getElementById('loginBtn').addEventListener('click', attemptLogin);
document.getElementById('loginPassword').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') attemptLogin();
});

// If already signed in as the owner (e.g. this tab was left open), skip
// straight through instead of asking for credentials again.
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session && session.user.id === PERCHQR_OWNER_ID) showConsole();
})();

// ---------- Administrator console: users, accounts, tiers ----------
// Same slug rules as signup.html and the agents table's CHECK constraints
// (format, length, reserved words) — keep the three in sync.
const RESERVED_SLUGS = new Set([
  'app','admin','api','www','mail','cdn','static','assets',
  'login','signup','signin','signout','logout','account',
  'billing','dashboard','settings','pricing','about','blog',
  'help','support','docs','terms','privacy','status','q','s',
]);
const slugFormatOk = s => /^[a-z0-9]+(-[a-z0-9]+)*$/.test(s) && s.length >= 3 && s.length <= 40;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = d => d ? new Date(d).toLocaleDateString() : '—';
const fmtDateTime = d => d ? new Date(d).toLocaleString() : '—';

let TIERS = [];
let STATUSES = [];
let AGENTS = [];
let QR_BY_AGENT = {};
let COMPLETION = {};
let currentSegment = 'default';
let currentProfileId = null;

const tierById = id => TIERS.find(t => t.id === id);
const statusById = id => STATUSES.find(s => s.id === id);
const tierName = id => (tierById(id) || {}).name || id || '—';
const statusName = id => (statusById(id) || {}).name || id || '—';
const agentName = id => { const a = AGENTS.find(x => x.id === id); return a ? a.display_name : 'Unknown'; };

function showMsg(text, isErr) {
  document.getElementById('consoleMsg').innerHTML = text ? `<div class="console-msg${isErr ? ' err' : ''}">${text}</div>` : '';
}
let toastTimer = null;
function toast(text, isErr) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 3800);
}

async function showConsole() {
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('console').classList.remove('hidden');
  await loadAll();
}

async function loadAll() {
  const [t, s, a, q, pr, ts, ml, st] = await Promise.all([
    sb.from('subscription_tiers').select('*').order('sort_order').order('name'),
    sb.from('account_statuses').select('*').order('sort_order'),
    sb.from('agents').select('*').order('created_at', { ascending: false }),
    sb.from('qr_codes').select('id, agent_id, url'),
    // for the "Profile complete" column (see Perch.profileCompletion)
    sb.from('properties').select('agent_id, status, video_url').limit(5000),
    sb.from('testimonials').select('agent_id').limit(5000),
    sb.from('mls_credentials').select('agent_id'),
    sb.from('agent_settings').select('agent_id, home_video_url'),
  ]);
  if (t.error || s.error) {
    console.error(t.error || s.error);
    showMsg('Account management isn\'t set up in the database yet. Run the latest <code>supabase/schema.sql</code> (section 10) in the Supabase SQL Editor, then reload.', true);
    return;
  }
  if (a.error) { console.error(a.error); showMsg('Could not load users.', true); return; }
  TIERS = t.data || [];
  STATUSES = s.data || [];
  AGENTS = a.data || [];
  QR_BY_AGENT = {};
  (q.data || []).forEach(x => { (QR_BY_AGENT[x.agent_id] = QR_BY_AGENT[x.agent_id] || []).push(x); });

  // How complete is each agent's page? (one checklist per agent)
  const by = (rows) => { const m = {}; (rows || []).forEach(r => { (m[r.agent_id] = m[r.agent_id] || []).push(r); }); return m; };
  const propsBy = by(pr.data), testsBy = by(ts.data), mlsBy = by(ml.data), setBy = by(st.data);
  COMPLETION = {};
  AGENTS.forEach(ag => {
    COMPLETION[ag.id] = Perch.profileCompletion({
      agent: ag,
      hasMls: (mlsBy[ag.id] || []).length > 0,
      properties: propsBy[ag.id] || [],
      testimonialCount: (testsBy[ag.id] || []).length,
      qrCount: (QR_BY_AGENT[ag.id] || []).length,
      hasHomeVideo: (setBy[ag.id] || []).some(r => r.home_video_url),
    });
  });
  renderTierFilter();
  renderList();
  renderTiersView();
  loadTodo(); // fills in the "To do" count badge
}

// A small bar + percentage; green when complete, amber otherwise.
function completionBar(c) {
  if (!c) return '—';
  const color = c.percent === 100 ? '#2a7a3b' : c.percent >= 60 ? '#b9923a' : '#b9923a';
  const missing = c.items.filter(i => !i.done).map(i => i.label).join(', ');
  return `<span style="display:flex;align-items:center;gap:8px;min-width:120px;" title="${esc(missing ? 'Still to do: ' + missing : 'Complete')}">
    <span style="flex:1;height:6px;background:#e4e6e0;border-radius:3px;overflow:hidden;"><span style="display:block;width:${c.percent}%;height:100%;background:${color};"></span></span>
    <span style="font-size:12.5px;">${c.percent}%</span></span>`;
}

// ---------- User list ----------
function segments() {
  const segs = [{ key: 'default', label: 'Active & Pending', match: a => a.status_id === 'active' || a.status_id === 'pending' }];
  STATUSES.filter(s => s.id !== 'active' && s.id !== 'pending').forEach(s =>
    segs.push({ key: s.id, label: s.id === 'archived' ? 'Archived accounts' : s.name, match: a => a.status_id === s.id }));
  segs.push({ key: 'all', label: 'All accounts', match: () => true });
  return segs;
}

function renderTierFilter() {
  const sel = document.getElementById('tierFilter');
  const keep = sel.value;
  sel.innerHTML = '<option value="">All subscriptions</option>' +
    TIERS.map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('');
  sel.value = keep;
}

function renderList() {
  const term = document.getElementById('searchBox').value.trim().toLowerCase();
  const tier = document.getElementById('tierFilter').value;
  const segs = segments();
  const seg = segs.find(s => s.key === currentSegment) || segs[0];

  document.getElementById('segments').innerHTML = segs.map(s =>
    `<button class="seg${s.key === seg.key && !term ? ' active' : ''}" data-seg="${esc(s.key)}">${esc(s.label)}<span class="n">${AGENTS.filter(s.match).length}</span></button>`).join('');

// ---------- Confirmation pop-up (every tier / status / beta-tester change) ----------
const STATUS_WARNINGS = {
  archived: 'Archiving removes this account from the normal user list and blocks the user from signing in to their dashboard or changing anything. Nothing is deleted: their listings, history and records are all kept, their public page and listings are not removed, and you can restore the account to Active at any time.',
  suspended: 'Suspending restricts this user: they will not be able to use their dashboard or change any of their data until you restore the account. Their information is kept, and their public page and listings are not removed.',
};

function confirmChange(agent, kind, newValue, revert) {
  const labels = { tier: 'Subscription Tier', status: 'Account Status', beta_tester: 'Beta Tester Designation' };
  const cur = kind === 'tier' ? agent.tier_id : kind === 'status' ? agent.status_id : String(!!agent.is_beta_tester);
  if (newValue === cur) { revert(); return; }
  const show = v => kind === 'tier' ? tierName(v) : kind === 'status' ? statusName(v) : (v === 'true' ? 'Yes' : 'No');

  let warning = '';
  if (kind === 'status') {
    warning = STATUS_WARNINGS[newValue] || '';
    if (!warning && statusById(newValue) && statusById(newValue).allows_access === false) {
      warning = `This status blocks the user from their dashboard until the account is restored to Active. Nothing is deleted.`;
    }
  }

  const host = document.getElementById('modalHost');
  host.innerHTML = `<div class="modal-bg" id="modalBg"><div class="modal" role="dialog" aria-modal="true">
      <h3>Confirm ${esc(labels[kind])} Change</h3>
      <p>You are about to change this user's ${esc(labels[kind].toLowerCase())}.</p>
      <div class="facts">
        <div><strong>User:</strong> ${esc(agent.display_name)}</div>
        <div><strong>Current ${esc(kind === 'tier' ? 'Tier' : kind === 'status' ? 'Status' : 'Value')}:</strong> ${esc(show(cur))}</div>
        <div><strong>New ${esc(kind === 'tier' ? 'Tier' : kind === 'status' ? 'Status' : 'Value')}:</strong> ${esc(show(newValue))}</div>
      </div>
      ${warning ? `<div class="warn"><strong>Please note:</strong> ${esc(warning)}</div>` : ''}
      <label class="reason-label" for="modalReason">Reason or note (optional, saved in the history)</label>
      <textarea id="modalReason" rows="2"></textarea>
      <p style="margin-top:12px;">Are you sure you want to make this change?</p>
      <div class="modal-actions">
        <button class="btn-sm" id="modalCancel">Cancel</button>
        <button class="btn-sm primary" id="modalConfirm">Confirm Change</button>
      </div>
    </div></div>`;

  const close = () => { host.innerHTML = ''; };
  document.getElementById('modalCancel').addEventListener('click', () => { close(); revert(); });
  document.getElementById('modalBg').addEventListener('mousedown', e => { if (e.target.id === 'modalBg') { close(); revert(); } });
  document.getElementById('modalConfirm').addEventListener('click', async () => {
    const btn = document.getElementById('modalConfirm');
    const reason = document.getElementById('modalReason').value.trim();
    btn.disabled = true; btn.textContent = 'Saving…';
    document.getElementById('modalCancel').disabled = true;
    const { error } = await sb.rpc('admin_set_account_field', { p_agent_id: agent.id, p_kind: kind, p_value: newValue, p_reason: reason || null });
    close();
    if (error) {
      console.error(error);
      toast('The change could not be saved: ' + (error.message || 'unknown error') + ' Nothing was changed.', true);
      revert();
      return;
    }
    toast(`${labels[kind]} updated for ${agent.display_name}.`);
    await loadAll();
    if (currentProfileId === agent.id) await openProfile(agent.id);
  });
  document.getElementById('modalConfirm').focus();
}

function openEditor(agentId) {
  const a = AGENTS.find(x => x.id === agentId);
  const box = document.getElementById('editor-' + agentId);
  if (!a || !box) return;
  const nQr = (QR_BY_AGENT[agentId] || []).length;
  box.classList.remove('hidden');
  box.innerHTML = `<div class="slug-editor-line">
      <span class="prefix">perchqr.com/</span>
      <input id="slugInput-${esc(agentId)}" value="${esc(a.slug)}" autocomplete="off" spellcheck="false">
      <button class="btn-sm primary" id="slugSave-${esc(agentId)}">Save</button>
      <button class="btn-sm" id="slugCancel-${esc(agentId)}">Cancel</button>
    </div>
    <div class="slug-status" id="slugStatus-${esc(agentId)}"></div>
    <div class="console-note">The old address stops working right away (links, bookmarks, and <code>/${esc(a.slug)}/access</code> sign-in). Printed QR codes keep working${nQr ? ` — and this agent's ${nQr} saved code destination${nQr === 1 ? '' : 's'} will be updated to the new address` : ''}. Tell the agent their new address.</div>`;
  const input = document.getElementById('slugInput-' + agentId);
  const status = document.getElementById('slugStatus-' + agentId);
  const save = document.getElementById('slugSave-' + agentId);
  let timer = null, valid = false;

  function check() {
    clearTimeout(timer);
    valid = false; save.disabled = true;
    input.value = input.value.toLowerCase().replace(/[^a-z0-9-]/g, '');
    const s = input.value;
    if (s === a.slug) { status.textContent = 'This is the current address.'; status.className = 'slug-status'; return; }
    if (!slugFormatOk(s)) { status.textContent = 'Use 3–40 lowercase letters, numbers and single hyphens.'; status.className = 'slug-status bad'; return; }
    if (RESERVED_SLUGS.has(s)) { status.textContent = 'That address is reserved.'; status.className = 'slug-status bad'; return; }
    status.textContent = 'Checking…'; status.className = 'slug-status';
    timer = setTimeout(async () => {
      const { data } = await sb.from('agents').select('id').eq('slug', s).maybeSingle();
      if (input.value !== s) return;
      if (data) { status.textContent = `perchqr.com/${s} is already taken.`; status.className = 'slug-status bad'; return; }
      status.textContent = `perchqr.com/${s} is available.`; status.className = 'slug-status ok';
      valid = true; save.disabled = false;
    }, 250);
  }
  input.addEventListener('input', check);
  document.getElementById('slugCancel-' + agentId).addEventListener('click', () => { box.classList.add('hidden'); box.innerHTML = ''; });
  save.addEventListener('click', () => { if (valid) changeSlug(a, input.value, save); });
  check();
  input.focus();
}

// Moves the agent to the new slug, then rewrites any of their QR destinations
// that point at the old address. (The QR images themselves encode /q/<id>, so
// printed signs never need to change.)
async function changeSlug(agent, newSlug, saveBtn) {
  const oldSlug = agent.slug;
  if (!confirm(`Change ${agent.display_name}'s page address?\n\nperchqr.com/${oldSlug}\n→ perchqr.com/${newSlug}\n\nThe old address will stop working.`)) return;
  saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
  showMsg('');
  const { error } = await sb.from('agents').update({ slug: newSlug }).eq('id', agent.id);
  if (error) {
    console.error(error);
    showMsg(error.code === '23505' ? `perchqr.com/${esc(newSlug)} was just taken — pick another.` : 'The change failed: ' + esc(error.message), true);
    saveBtn.disabled = false; saveBtn.textContent = 'Save';
    return;
  }
  let updated = 0, failed = 0;
  for (const q of (QR_BY_AGENT[agent.id] || [])) {
    const next = rewriteQrUrl(q.url, oldSlug, newSlug);
    if (!next) continue;
    const { error: qErr } = await sb.from('qr_codes').update({ url: next }).eq('id', q.id);
    if (qErr) { console.error(qErr); failed++; } else updated++;
  }
  await loadAll();
  if (currentProfileId === agent.id) await openProfile(agent.id);
  let text = `Done. ${esc(agent.display_name)} is now at <strong>perchqr.com/${esc(newSlug)}</strong>.`;
  if (updated) text += ` Updated ${updated} QR code destination${updated === 1 ? '' : 's'}.`;
  if (failed) { showMsg(text + ` ${failed} QR code destination${failed === 1 ? '' : 's'} could not be updated — the agent should check the QR Codes tab.`, true); return; }
  showMsg(text);
}

function rewriteQrUrl(url, oldSlug, newSlug) {
  try {
    const u = new URL(url);
    if (u.pathname === '/' + oldSlug || u.pathname.startsWith('/' + oldSlug + '/')) {
      u.pathname = '/' + newSlug + u.pathname.slice(oldSlug.length + 1);
      return u.toString();
    }
  } catch (e) { /* not a URL we can rewrite */ }
  return null;
}

async function saveTier(id) {
  const row = document.querySelector(`[data-tier="${id}"]`);
  const name = row.querySelector('[data-f=name]').value.trim();
  if (!name) { toast('A tier needs a name.', true); return; }
  const patch = {
    name,
    description: row.querySelector('[data-f=description]').value.trim() || null,
    is_active: row.querySelector('[data-f=is_active]').checked,
  };
  const { error } = await sb.from('subscription_tiers').update(patch).eq('id', id);
  if (error) { console.error(error); toast('Could not save the tier.', true); return; }
  toast('Tier saved.');
  await loadAll();
}

async function addTier() {
  const key = document.getElementById('newTierKey').value.trim().toLowerCase();
  const name = document.getElementById('newTierName').value.trim();
  if (!/^[a-z0-9_]+$/.test(key)) { toast('Use lowercase letters, numbers and underscores for the key.', true); return; }
  if (!name) { toast('Give the tier a display name.', true); return; }
  if (tierById(key)) { toast('That key is already in use.', true); return; }
  const nextSort = TIERS.reduce((m, t) => Math.max(m, t.sort_order || 0), 0) + 10;
  const { error } = await sb.from('subscription_tiers').insert({ id: key, name, sort_order: nextSort });
  if (error) { console.error(error); toast('Could not add the tier.', true); return; }
  toast('Tier added.');
  await loadAll();
}

    console.error(error);
    el.innerHTML = '<div class="console-msg err">The location to-do list isn\'t set up in the database yet. Run the latest <code>supabase/schema.sql</code> (section 13) in the Supabase SQL Editor, then reload.</div>';
    document.getElementById('todoBadge').classList.add('hidden');
    return;
  }
  TODO_PROPS = data || [];
  renderTodo();
}

function renderTodo() {
  const el = document.getElementById('todoView');
  const needs = TODO_PROPS.filter(p => !p.location_verified_at);
  const done = TODO_PROPS.filter(p => p.location_verified_at);
  const badge = document.getElementById('todoBadge');
  badge.textContent = needs.length;
  badge.classList.toggle('hidden', !needs.length);

  const rows = todoFilter === 'needs' ? needs : done.sort((a, b) => new Date(b.location_verified_at) - new Date(a.location_verified_at));
  const coord = v => (v == null ? '' : Number(v).toFixed(6));
  el.innerHTML = `
    <h1>To do</h1>
    <p class="console-sub">Check each new listing's pin on the map, fix the coordinates if needed, then mark it verified. A listing comes back here if its agent changes the address or coordinates.</p>
    <div class="segments" style="margin-bottom:14px;">
      <button class="seg${todoFilter === 'needs' ? ' active' : ''}" data-todo-filter="needs">Needs checking<span class="n">${needs.length}</span></button>
      <button class="seg${todoFilter === 'verified' ? ' active' : ''}" data-todo-filter="verified">Verified<span class="n">${done.length}</span></button>
    </div>
    ${rows.length ? rows.map(p => `<div class="card" data-todo="${esc(p.id)}">
      <div class="agent-line" style="align-items:flex-start;">
        <div>
          <div class="u-name">${esc(p.addr)}, ${esc(p.city)}</div>
          <div class="agent-meta">${esc(agentName(p.agent_id))} &middot; added ${esc(fmtDateTime(p.created_at))} &middot; ${esc(p.status)}${p.location_verified_at ? ` &middot; verified ${esc(fmtDateTime(p.location_verified_at))}${p.location_verified_by ? ' by ' + esc(agentName(p.location_verified_by)) : ''}` : ''}</div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <a class="btn-sm" href="${esc(mapsUrl(p))}" target="_blank" rel="noopener">Google Maps</a>
          <a class="btn-sm" href="${esc(earthUrl(p))}" target="_blank" rel="noopener">Google Earth</a>
        </div>
      </div>
      <div class="ctl-row" style="margin-top:12px;">
        <div class="ctl"><label>Latitude</label><input data-lat value="${esc(coord(p.lat))}" style="width:150px;margin:0;font-family:var(--mono);" inputmode="decimal"></div>
        <div class="ctl"><label>Longitude</label><input data-lng value="${esc(coord(p.lng))}" style="width:150px;margin:0;font-family:var(--mono);" inputmode="decimal"></div>
        <div class="ctl" style="display:flex;gap:8px;">
          <button class="btn-sm primary" data-verify="${esc(p.id)}">${p.location_verified_at ? 'Save and re-verify' : 'Save and mark verified'}</button>
        </div>
      </div>
    </div>`).join('') : `<div class="muted" style="padding:14px 2px;">${todoFilter === 'needs' ? 'Nothing to check right now.' : 'Nothing verified yet.'}</div>`}`;

  el.querySelectorAll('[data-todo-filter]').forEach(b => b.addEventListener('click', () => { todoFilter = b.dataset.todoFilter; renderTodo(); }));
  el.querySelectorAll('[data-verify]').forEach(b => b.addEventListener('click', () => verifyLocation(b.dataset.verify, b)));
}

async function verifyLocation(id, btn) {
  const card = document.querySelector(`[data-todo="${CSS.escape(id)}"]`);
  const latRaw = card.querySelector('[data-lat]').value.trim();
  const lngRaw = card.querySelector('[data-lng]').value.trim();
  const lat = latRaw === '' ? null : Number(latRaw);
  const lng = lngRaw === '' ? null : Number(lngRaw);
  if ((lat !== null && (!isFinite(lat) || lat < -90 || lat > 90)) || (lng !== null && (!isFinite(lng) || lng < -180 || lng > 180))) {
    toast('Enter valid coordinates (latitude -90 to 90, longitude -180 to 180).', true); return;
  }
  if (lat === null || lng === null) { toast('Add both a latitude and a longitude first.', true); return; }
  const { data: { user } } = await sb.auth.getUser();
  btn.disabled = true; btn.textContent = 'Saving…';
  const { error } = await sb.from('properties')
    .update({ lat, lng, location_verified_at: new Date().toISOString(), location_verified_by: user ? user.id : null })
    .eq('id', id);
  if (error) { console.error(error); toast('Could not save: ' + (error.message || 'unknown error'), true); btn.disabled = false; btn.textContent = 'Save and mark verified'; return; }
  toast('Location verified.');
  await loadTodo();
}

document.getElementById('signOutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  window.location.reload();
});
</script>
</body>
