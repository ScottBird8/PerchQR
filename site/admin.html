<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PerchQR Administrator</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
<style>
/* Owner-only gate, deliberately unlisted (no link to this page appears
   anywhere on the public site or in /app) and separate from the shared
   agent sign-in at /app. Signing in here still authenticates against the
   same Supabase Auth user pool as everywhere else — there is no second
   credential system — but this page checks the signed-in user's id
   against PERCHQR_OWNER_ID before granting entry, and immediately signs
   out and rejects anyone else's account, even a valid agent login. */
:root{
  --bg:#EFF0EB;
  --panel:#FFFFFF;
  --maroon:#3B4A5A;
  --maroon-bright:#4E6178;
  --maroon-wash:#E3E7E9;
  --charcoal:#23262B;
  --charcoal-soft:#585F5C;
  --line:#DBDDD5;
  --line-bright:#C7CBC3;
  --display:'Fraunces', serif;
  --body:'Karla', sans-serif;
  --mono:'JetBrains Mono', monospace;
  --radius:10px;
}
body{background:var(--bg);}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.gate-card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:32px;text-align:center;box-shadow:0 20px 45px -22px rgba(35,38,43,0.28);}
.wordmark{font-family:var(--display);font-weight:700;font-size:20px;color:var(--maroon);display:flex;align-items:center;justify-content:center;gap:9px;margin:0 0 6px;}
.wordmark-icon{color:var(--maroon);flex-shrink:0;}
.eyebrow{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--charcoal-soft);margin:0 0 20px;}
h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0 0 18px;}
input{width:100%;padding:11px 14px;border:1px solid var(--line-bright);border-radius:8px;font-family:var(--body);font-size:14px;margin-bottom:10px;background:#fff;color:var(--charcoal);}
button{width:100%;margin-top:6px;font-family:var(--body);font-weight:600;font-size:14.5px;padding:12px;border-radius:6px;border:none;background:var(--maroon);color:#fff;cursor:pointer;}
button:hover{background:var(--maroon-bright);}
button:disabled{opacity:0.6;cursor:default;}
.gate-error{color:var(--maroon);font-size:13px;margin-top:12px;}
.hidden{display:none!important;}

/* Signed-in administrator console (shown in place of the gate). */
.console{max-width:980px;margin:0 auto;padding:28px 20px 60px;}
.console-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px;}
.console-bar .wordmark{margin:0;justify-content:flex-start;}
.console-bar-actions{display:flex;gap:8px;align-items:center;}
.console h1{font-family:var(--display);font-weight:600;font-size:24px;margin:0 0 4px;}
.console-sub{color:var(--charcoal-soft);font-size:14px;margin:0 0 18px;}
.btn-sm{width:auto;margin:0;padding:7px 13px;font-size:13px;border-radius:6px;border:1px solid var(--line-bright);background:#fff;color:var(--charcoal);text-decoration:none;display:inline-block;cursor:pointer;font-family:var(--body);font-weight:600;}
.btn-sm:hover{background:var(--maroon-wash);}
.btn-sm.primary{background:var(--maroon);color:#fff;border-color:var(--maroon);}
.btn-sm.primary:hover{background:var(--maroon-bright);}
.agent-row{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;}
.agent-line{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.agent-name{font-weight:700;font-size:15px;}
.agent-meta{color:var(--charcoal-soft);font-size:13px;margin-top:2px;}
.agent-url{font-family:var(--mono);font-size:12.5px;margin-top:6px;}
.agent-url a{color:var(--maroon);}
.slug-editor{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
.slug-editor-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.slug-editor-line .prefix{font-family:var(--mono);font-size:13px;color:var(--charcoal-soft);}
.slug-editor input{width:240px;margin:0;font-family:var(--mono);}
.slug-status{font-family:var(--mono);font-size:12px;margin-top:8px;color:var(--charcoal-soft);}
.slug-status.ok{color:#2a7a3b;}
.slug-status.bad{color:#a33;}
.console-note{font-size:12.5px;color:var(--charcoal-soft);margin-top:6px;line-height:1.5;}
.console-msg{background:#E6F2E8;border:1px solid #b9d9bf;color:#1f5c2c;border-radius:8px;padding:10px 14px;font-size:13.5px;margin-bottom:14px;}
.console-msg.err{background:#F8E7E7;border-color:#e3b9b9;color:#8a2a2a;}
</style>
</head>
<body>
<div class="console hidden" id="console">
  <div class="console-bar">
    <div class="wordmark">
      <svg class="wordmark-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3M19 14h2M14 19h2M19 19h2"/></svg>
      PerchQR Administrator
    </div>
    <div class="console-bar-actions">
      <a class="btn-sm" href="/app">User dashboard</a>
      <button class="btn-sm" id="signOutBtn">Sign out</button>
    </div>
  </div>
  <h1>Agents</h1>
  <p class="console-sub">Everyone who has signed up. Change a page address here when someone picked the wrong one.</p>
  <div id="consoleMsg"></div>
  <div id="agentList"><div class="agent-meta">Loading&hellip;</div></div>
</div>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="wordmark">
      <svg class="wordmark-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3M19 14h2M14 19h2M19 19h2"/></svg>
      PerchQR
    </div>
    <div class="eyebrow">Administrator</div>
    <h2>Sign in</h2>
    <input id="loginEmail" type="email" placeholder="Email" autocomplete="username">
    <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn">Sign in</button>
    <div class="gate-error hidden" id="loginError"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/supabase-client.js"></script>
<script>
// Mirrors the same id used in supabase/schema.sql's is_perchqr_owner() and
// app.html's PERCHQR_OWNER_ID — keep all three in sync if this ever changes.
const PERCHQR_OWNER_ID = '72158799-b0f4-47c9-ac2a-45ffe52db1df';

async function attemptLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errEl.classList.add('hidden');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    if (data.user.id !== PERCHQR_OWNER_ID) {
      await sb.auth.signOut();
      throw new Error('This sign-in is for the PerchQR administrator only.');
    }
    await showConsole();
  } catch (err) {
    errEl.textContent = err.message || 'Sign-in failed.';
    errEl.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Sign in';
  }
}

document.getElementById('loginBtn').addEventListener('click', attemptLogin);
document.getElementById('loginPassword').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') attemptLogin();
});

// If already signed in as the owner (e.g. this tab was left open), skip
// straight through instead of asking for credentials again.
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session && session.user.id === PERCHQR_OWNER_ID) showConsole();
})();

// ---------- Administrator console: agents + page-address changes ----------
// Same rules as signup.html and the agents table's CHECK constraints (format,
// length, reserved words) — keep the three in sync.
const RESERVED_SLUGS = new Set([
  'app','admin','api','www','mail','cdn','static','assets',
  'login','signup','signin','signout','logout','account',
  'billing','dashboard','settings','pricing','about','blog',
  'help','support','docs','terms','privacy','status','q','s',
]);
const slugFormatOk = s => /^[a-z0-9]+(-[a-z0-9]+)*$/.test(s) && s.length >= 3 && s.length <= 40;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let AGENTS = [];
let QR_BY_AGENT = {};

function showMsg(text, isErr) {
  document.getElementById('consoleMsg').innerHTML = text ? `<div class="console-msg${isErr ? ' err' : ''}">${text}</div>` : '';
}

async function showConsole() {
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('console').classList.remove('hidden');
  await loadAgents();
}

async function loadAgents() {
  const [{ data: agents, error }, { data: qrs }] = await Promise.all([
    sb.from('agents').select('id, slug, display_name, email, phone, created_at').order('created_at', { ascending: false }),
    sb.from('qr_codes').select('id, agent_id, url'),
  ]);
  if (error) { console.error(error); showMsg('Could not load agents.', true); return; }
  AGENTS = agents || [];
  QR_BY_AGENT = {};
  (qrs || []).forEach(q => { (QR_BY_AGENT[q.agent_id] = QR_BY_AGENT[q.agent_id] || []).push(q); });
  renderAgents();
}

function renderAgents() {
  const el = document.getElementById('agentList');
  if (!AGENTS.length) { el.innerHTML = '<div class="agent-meta">No agents yet.</div>'; return; }
  el.innerHTML = AGENTS.map(a => {
    const isOwner = a.id === PERCHQR_OWNER_ID;
    const joined = a.created_at ? new Date(a.created_at).toLocaleDateString() : '';
    return `<div class="agent-row" data-agent="${esc(a.id)}">
      <div class="agent-line">
        <div>
          <div class="agent-name">${esc(a.display_name)}${isOwner ? ' (you)' : ''}</div>
          <div class="agent-meta">${esc(a.email || 'no email')}${a.phone ? ' &middot; ' + esc(a.phone) : ''}${joined ? ' &middot; joined ' + esc(joined) : ''}</div>
          <div class="agent-url"><a href="/${esc(a.slug)}" target="_blank" rel="noopener">perchqr.com/${esc(a.slug)}</a></div>
        </div>
        <button class="btn-sm" data-edit="${esc(a.id)}">Change page address</button>
      </div>
      <div class="slug-editor hidden" id="editor-${esc(a.id)}"></div>
    </div>`;
  }).join('');
  el.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openEditor(b.dataset.edit)));
}

function openEditor(agentId) {
  const a = AGENTS.find(x => x.id === agentId);
  const box = document.getElementById('editor-' + agentId);
  if (!a || !box) return;
  const nQr = (QR_BY_AGENT[agentId] || []).length;
  box.classList.remove('hidden');
  box.innerHTML = `<div class="slug-editor-line">
      <span class="prefix">perchqr.com/</span>
      <input id="slugInput-${esc(agentId)}" value="${esc(a.slug)}" autocomplete="off" spellcheck="false">
      <button class="btn-sm primary" id="slugSave-${esc(agentId)}">Save</button>
      <button class="btn-sm" id="slugCancel-${esc(agentId)}">Cancel</button>
    </div>
    <div class="slug-status" id="slugStatus-${esc(agentId)}"></div>
    <div class="console-note">The old address stops working right away (links, bookmarks, and <code>/${esc(a.slug)}/access</code> sign-in). Printed QR codes keep working${nQr ? ` — and this agent's ${nQr} saved code destination${nQr === 1 ? '' : 's'} will be updated to the new address` : ''}. Tell the agent their new address.</div>`;
  const input = document.getElementById('slugInput-' + agentId);
  const status = document.getElementById('slugStatus-' + agentId);
  const save = document.getElementById('slugSave-' + agentId);
  let timer = null, valid = false;

  function check() {
    clearTimeout(timer);
    valid = false; save.disabled = true;
    input.value = input.value.toLowerCase().replace(/[^a-z0-9-]/g, '');
    const s = input.value;
    if (s === a.slug) { status.textContent = 'This is the current address.'; status.className = 'slug-status'; return; }
    if (!slugFormatOk(s)) { status.textContent = 'Use 3–40 lowercase letters, numbers and single hyphens.'; status.className = 'slug-status bad'; return; }
    if (RESERVED_SLUGS.has(s)) { status.textContent = 'That address is reserved.'; status.className = 'slug-status bad'; return; }
    status.textContent = 'Checking…'; status.className = 'slug-status';
    timer = setTimeout(async () => {
      const { data } = await sb.from('agents').select('id').eq('slug', s).maybeSingle();
      if (input.value !== s) return;
      if (data) { status.textContent = `perchqr.com/${s} is already taken.`; status.className = 'slug-status bad'; return; }
      status.textContent = `perchqr.com/${s} is available.`; status.className = 'slug-status ok';
      valid = true; save.disabled = false;
    }, 250);
  }
  input.addEventListener('input', check);
  document.getElementById('slugCancel-' + agentId).addEventListener('click', () => { box.classList.add('hidden'); box.innerHTML = ''; });
  save.addEventListener('click', () => { if (valid) changeSlug(a, input.value, save); });
  check();
  input.focus();
}

// Moves the agent to the new slug, then rewrites any of their QR destinations
// that point at the old address. (The QR images themselves encode /q/<id>, so
// printed signs never need to change.)
async function changeSlug(agent, newSlug, saveBtn) {
  const oldSlug = agent.slug;
  if (!confirm(`Change ${agent.display_name}'s page address?\n\nperchqr.com/${oldSlug}\n→ perchqr.com/${newSlug}\n\nThe old address will stop working.`)) return;
  saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
  showMsg('');
  const { error } = await sb.from('agents').update({ slug: newSlug }).eq('id', agent.id);
  if (error) {
    console.error(error);
    showMsg(error.code === '23505' ? `perchqr.com/${esc(newSlug)} was just taken — pick another.` : 'The change failed: ' + esc(error.message), true);
    saveBtn.disabled = false; saveBtn.textContent = 'Save';
    return;
  }
  let updated = 0, failed = 0;
  for (const q of (QR_BY_AGENT[agent.id] || [])) {
    const next = rewriteQrUrl(q.url, oldSlug, newSlug);
    if (!next) continue;
    const { error: qErr } = await sb.from('qr_codes').update({ url: next }).eq('id', q.id);
    if (qErr) { console.error(qErr); failed++; } else updated++;
  }
  await loadAgents();
  let text = `Done. ${esc(agent.display_name)} is now at <strong>perchqr.com/${esc(newSlug)}</strong>.`;
  if (updated) text += ` Updated ${updated} QR code destination${updated === 1 ? '' : 's'}.`;
  if (failed) { showMsg(text + ` ${failed} QR code destination${failed === 1 ? '' : 's'} could not be updated — the agent should check the QR Codes tab.`, true); return; }
  showMsg(text);
}

function rewriteQrUrl(url, oldSlug, newSlug) {
  try {
    const u = new URL(url);
    if (u.pathname === '/' + oldSlug || u.pathname.startsWith('/' + oldSlug + '/')) {
      u.pathname = '/' + newSlug + u.pathname.slice(oldSlug.length + 1);
      return u.toString();
    }
  } catch (e) { /* not a URL we can rewrite */ }
  return null;
}

document.getElementById('signOutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  window.location.reload();
});
</script>
</body>
</html>
