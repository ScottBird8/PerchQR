<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — FlyerBox</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
<style>
/* Signup is a FlyerBox product page (like the admin), not an agent-branded
   page — same Fieldstone override technique as app.html: redefine the
   shared theme's variable NAMES so styles.css's base rules pick up
   FlyerBox's own palette/type without needing their own stylesheet. */
:root{
  --bg:#EFF0EB;
  --panel:#FFFFFF;
  --maroon:#3B4A5A;
  --maroon-bright:#4E6178;
  --maroon-wash:#E3E7E9;
  --error:#C62828;
  --error-wash:#FDECEC;
  --charcoal:#23262B;
  --charcoal-soft:#585F5C;
  --line:#DBDDD5;
  --line-bright:#C7CBC3;
  --display:'Fraunces', serif;
  --body:'Karla', sans-serif;
  --mono:'JetBrains Mono', monospace;
  --radius:10px;
}
body{background:var(--bg);}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:32px;box-shadow:0 20px 45px -22px rgba(35,38,43,0.28);}
.wordmark{font-family:var(--display);font-weight:700;font-size:20px;color:var(--maroon);display:flex;align-items:center;justify-content:center;gap:9px;margin:0 0 20px;}
.wordmark-icon{color:var(--maroon);flex-shrink:0;}
h2{font-family:var(--display);font-weight:600;font-size:20px;text-align:center;margin:0 0 22px;}
.field{margin-bottom:14px;}
.field label{display:block;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--charcoal-soft);margin-bottom:5px;}
.field input,.field select{width:100%;padding:11px 13px;border:1px solid var(--line-bright);border-radius:8px;font-family:var(--body);font-size:14px;background:#fff;color:var(--charcoal);}
.slug-preview{font-family:var(--mono);font-size:12px;color:var(--charcoal-soft);margin-top:5px;}
.slug-preview.ok{color:#2a7a3b;}
.slug-preview.bad{color:var(--error);font-weight:600;}
.field-hint{font-size:11.5px;color:var(--charcoal-soft);margin-top:5px;}
.btn-block{width:100%;font-family:var(--body);font-weight:600;font-size:14.5px;padding:12px;border-radius:6px;border:none;background:var(--maroon);color:#fff;cursor:pointer;margin-top:8px;}
.btn-block:hover{background:var(--maroon-bright);}
.btn-block:disabled{opacity:0.6;cursor:default;}
/* Problems are always red so they can't be missed. */
.error-msg{color:var(--error);background:var(--error-wash);border:1px solid var(--error);border-radius:8px;font-size:13.5px;font-weight:600;margin-top:12px;padding:10px 12px;text-align:center;}
.field-error{display:none;color:var(--error);font-size:12.5px;font-weight:700;margin-top:5px;}
.field.has-error .field-error{display:block;}
.field.has-error label{color:var(--error);}
.field.has-error input,.field.has-error select{border-color:var(--error);background:var(--error-wash);box-shadow:0 0 0 3px rgba(198,40,40,0.16);}
.field.has-error .field-hint{display:none;}
.field-error:empty{display:none!important;}
/* A page address that is invalid, reserved or taken also turns its box red. */
.field:has(.slug-preview.bad) input{border-color:var(--error);background:var(--error-wash);box-shadow:0 0 0 3px rgba(198,40,40,0.16);}
.done-msg{text-align:center;}
.done-msg p{color:var(--charcoal-soft);font-size:14.5px;line-height:1.6;}
.foot-link{text-align:center;margin-top:18px;font-size:13px;color:var(--charcoal-soft);}
.foot-link a{color:var(--maroon);font-weight:600;}
.hidden{display:none!important;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="wordmark">
      <svg class="wordmark-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3M19 14h2M14 19h2M19 19h2"/></svg>
      <span>Flyer<span class="wm-box">Box</span></span>
    </div>

    <div id="formState">
      <h2>Create your account</h2>

      <div class="field">
        <label>Full name</label>
        <input id="su_name" placeholder="Jane Doe" autocomplete="name">
        <div class="field-error"></div>
      </div>

      <div class="field">
        <label>Set up your URL name (web page address)</label>
        <input id="su_slug" placeholder="jane-doe">
        <div class="slug-preview" id="slugPreview">flyerbox.net/&hellip;</div>
        <div class="field-error"></div>
      </div>

      <div class="field">
        <label>Phone</label>
        <input id="su_phone" type="tel" autocomplete="tel">
        <div class="field-error"></div>
        <div class="field-hint">Shown on your page so buyers can call or text you.</div>
      </div>

      <div class="field">
        <label>Your MLS (optional)</label>
        <select id="su_mls">
          <option value="">Choose your MLS&hellip;</option>
        </select>
        <input id="su_mls_other" class="hidden" placeholder="Type the name of your MLS" style="margin-top:8px;">
        <div class="field-hint">Helps us set up your listing import. You can skip this for now.</div>
      </div>

      <div class="field">
        <label>Email</label>
        <input id="su_email" type="email" autocomplete="email">
        <div class="field-error"></div>
      </div>

      <div class="field">
        <label>Password</label>
        <input id="su_password" type="password" autocomplete="new-password">
        <div class="field-error"></div>
        <div class="field-hint">At least 6 characters.</div>
      </div>

      <button class="btn-block" id="signupBtn">Create account</button>
      <div class="error-msg hidden" id="signupError"></div>
      <div class="foot-link">Already have an account? <a href="/app">Sign in</a></div>
    </div>

    <div id="doneState" class="done-msg hidden">
      <h2 id="doneHeading">Check your email</h2>
      <p id="doneText"></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/supabase-client.js"></script>
<script>
const RESERVED_SLUGS = new Set([
  'app','admin','api','www','mail','cdn','static','assets',
  'login','signup','signin','signout','logout','account',
  'billing','dashboard','settings','pricing','about','blog',
  'help','support','docs','terms','privacy','status','q','s',
]);

// MLS boards we already know about; anything else is typed under "Other".
// Just a list of names — add a board here when agents from it sign up.
const KNOWN_MLS = [
  'Washington County Board of REALTORS',
  'Iron County Board of REALTORS',
];
const mlsSelectEl = document.getElementById('su_mls');
const mlsOtherEl = document.getElementById('su_mls_other');
KNOWN_MLS.forEach(n => mlsSelectEl.add(new Option(n, n)));
mlsSelectEl.add(new Option('Other (type it in)', '__other'));
mlsSelectEl.addEventListener('change', () => {
  mlsOtherEl.classList.toggle('hidden', mlsSelectEl.value !== '__other');
  if (mlsSelectEl.value === '__other') mlsOtherEl.focus();
});
function chosenMls() {
  if (mlsSelectEl.value === '__other') return mlsOtherEl.value.trim() || null;
  return mlsSelectEl.value || null;
}

function slugify(s) {
  return (s || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '').slice(0, 40);
}
function slugFormatOk(s) {
  return /^[a-z0-9]+(-[a-z0-9]+)*$/.test(s) && s.length >= 3 && s.length <= 40;
}

const nameEl = document.getElementById('su_name');
const slugEl = document.getElementById('su_slug');
const previewEl = document.getElementById('slugPreview');
let slugTouched = false;
let slugCheckTimer = null;

nameEl.addEventListener('input', () => {
  if (!slugTouched) { slugEl.value = slugify(nameEl.value); checkSlug(); }
});
slugEl.addEventListener('input', () => {
  slugTouched = true;
  slugEl.value = slugEl.value.toLowerCase().replace(/[^a-z0-9-]/g, '');
  checkSlug();
});

// Tries base-2, base-3, ... up to base-20 and returns the first one not
// already taken (or null if even that many are somehow all in use).
async function findAvailableSlug(base) {
  for (let n = 2; n <= 20; n++) {
    const candidate = `${base}-${n}`.slice(0, 40);
    const { data } = await sb.from('agents').select('id').eq('slug', candidate).maybeSingle();
    if (!data) return candidate;
  }
  return null;
}

function checkSlug() {
  clearTimeout(slugCheckTimer);
  const slug = slugEl.value;
  if (!slug) { previewEl.textContent = 'flyerbox.net/…'; previewEl.className = 'slug-preview'; return; }
  if (!slugFormatOk(slug)) {
    previewEl.textContent = 'Use 3+ lowercase letters, numbers, and hyphens only.';
    previewEl.className = 'slug-preview bad';
    return;
  }
  if (RESERVED_SLUGS.has(slug)) {
    previewEl.textContent = `flyerbox.net/${slug} — that address is reserved.`;
    previewEl.className = 'slug-preview bad';
    return;
  }
  previewEl.textContent = `flyerbox.net/${slug} — checking…`;
  previewEl.className = 'slug-preview';
  slugCheckTimer = setTimeout(async () => {
    if (slugEl.value !== slug) return;
    const { data } = await sb.from('agents').select('id').eq('slug', slug).maybeSingle();
    if (slugEl.value !== slug) return;
    if (data) {
      const alt = await findAvailableSlug(slug);
      if (slugEl.value !== slug) return;
      previewEl.innerHTML = `flyerbox.net/${slug} — already taken.` +
        (alt ? ` <a href="#" id="slugAltLink" style="color:var(--maroon);font-weight:600;">Try ${alt} instead &rarr;</a>` : '');
      previewEl.className = 'slug-preview bad';
      const altLink = document.getElementById('slugAltLink');
      if (altLink) altLink.addEventListener('click', (e) => {
        e.preventDefault();
        slugTouched = true;
        slugEl.value = alt;
        checkSlug();
      });
    } else {
      previewEl.textContent = `flyerbox.net/${slug} — available.`;
      previewEl.className = 'slug-preview ok';
    }
  }, 400);
}

document.getElementById('signupBtn').addEventListener('click', async () => {
  const name = nameEl.value.trim();
  const slug = slugEl.value.trim();
  const email = document.getElementById('su_email').value.trim();
  const phone = document.getElementById('su_phone').value.replace(/\D/g, '');
  const password = document.getElementById('su_password').value;
  const mls = chosenMls();
  clearErrors();

  // Check every field and mark ALL the problems in red at once, then jump to
  // the first one.
  const problems = [];
  if (!name) problems.push(['su_name', 'Enter your full name.']);
  if (!slug) problems.push(['su_slug', 'Choose a web page address.']);
  else if (!slugFormatOk(slug)) problems.push(['su_slug', 'Use 3+ lowercase letters, numbers and hyphens only.']);
  else if (RESERVED_SLUGS.has(slug)) problems.push(['su_slug', 'That page address is reserved — choose another.']);
  if (phone.length < 10) problems.push(['su_phone', 'Enter a 10-digit phone number.']);
  if (!email) problems.push(['su_email', 'Enter your email.']);
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) problems.push(['su_email', 'That email address doesn\'t look right.']);
  if (!password) problems.push(['su_password', 'Enter a password.']);
  else if (password.length < 6) problems.push(['su_password', 'Password is too short — use at least 6 characters.']);
  if (problems.length) { problems.forEach(([id, msg]) => fieldError(id, msg)); focusFirstError(); return; }

  const btn = document.getElementById('signupBtn');
  btn.disabled = true; btn.textContent = 'Creating account…';
  try {
    const { data: existing } = await sb.from('agents').select('id').eq('slug', slug).maybeSingle();
    if (existing) { fieldError('su_slug', 'That page address was just taken — choose another.'); focusFirstError(); return; }

    const { data, error } = await sb.auth.signUp({
      email, password,
      options: {
        data: { pending_slug: slug, pending_display_name: name, pending_phone: phone, pending_mls: mls },
        emailRedirectTo: window.location.origin + '/app',
      },
    });
    if (error) throw error;

    if (data.session) {
      // Confirmation not required (or auto-confirmed) — we have a real
      // session right now, so create the agents row immediately.
      const { error: insErr } = await sb.from('agents').insert({
        id: data.user.id, slug, display_name: name, email, phone,
      });
      if (insErr) throw insErr;
      // The MLS is optional extra info — saved separately so a problem with
      // it can never stop the account from being created.
      if (mls) {
        const { error: mlsErr } = await sb.from('agents').update({ mls_name: mls }).eq('id', data.user.id);
        if (mlsErr) console.error(mlsErr);
      }
      window.location.href = `/${slug}/access`;
      return;
    }

    // Confirmation required — no session yet, so the agents row can't be
    // created until they confirm and sign in (app.html's checkAuth() does
    // that from the pending_slug/pending_display_name metadata above).
    document.getElementById('formState').classList.add('hidden');
    document.getElementById('doneHeading').textContent = 'Check your email';
    document.getElementById('doneText').textContent =
      `We sent a confirmation link to ${email}. Click it, then come back and sign in at flyerbox.net/${slug}/access.`;
    document.getElementById('doneState').classList.remove('hidden');
  } catch (err) {
    console.error(err);
    const msg = err.message || '';
    const low = msg.toLowerCase();
    if (low.includes('already registered') || low.includes('already been registered')) {
      fieldError('su_email', 'An account with that email already exists. Sign in instead, or use a different email.');
    } else if (low.includes('duplicate') || low.includes('unique')) {
      fieldError('su_slug', 'That page address was just taken — choose another.');
    } else if (low.includes('password')) {
      fieldError('su_password', msg);
    } else if (low.includes('email')) {
      fieldError('su_email', msg);
    } else if (low.includes('rate limit') || low.includes('too many')) {
      showError('Too many attempts. Wait a minute and try again.');
    } else {
      showError(msg || 'Something went wrong — try again.');
    }
    focusFirstError();
  } finally {
    btn.disabled = false; btn.textContent = 'Create account';
  }
});

// ---- Errors: always red, on the field that needs fixing ----
function clearErrors() {
  document.querySelectorAll('.field.has-error').forEach(f => f.classList.remove('has-error'));
  document.querySelectorAll('.field-error').forEach(e => { e.textContent = ''; });
  document.getElementById('signupError').classList.add('hidden');
}
function fieldError(inputId, msg) {
  const field = document.getElementById(inputId).closest('.field');
  field.classList.add('has-error');
  field.querySelector('.field-error').textContent = msg;
}
// A general (not tied to one field) problem: red box above the button.
function showError(msg) {
  const errEl = document.getElementById('signupError');
  errEl.textContent = msg;
  errEl.classList.remove('hidden');
  errEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
function focusFirstError() {
  const first = document.querySelector('.field.has-error, .field:has(.slug-preview.bad)');
  if (!first) return;
  first.scrollIntoView({ block: 'center', behavior: 'smooth' });
  const input = first.querySelector('input, select');
  if (input) input.focus({ preventScroll: true });
}
// Typing in a field clears its own red marking.
document.querySelectorAll('.field input, .field select').forEach(el => {
  const clear = () => {
    const f = el.closest('.field');
    f.classList.remove('has-error');
    const fe = f.querySelector('.field-error');
    if (fe) fe.textContent = '';
  };
  el.addEventListener('input', clear);
  el.addEventListener('change', clear);
});

// Coming from the landing page's "Request beta access" form: it passes the
// name and email along so they don't have to be typed twice.
(function prefillFromRequest() {
  const params = new URLSearchParams(window.location.search);
  const name = params.get('name');
  const email = params.get('email');
  if (name) { nameEl.value = name; nameEl.dispatchEvent(new Event('input')); }
  if (email) document.getElementById('su_email').value = email;
})();
</script>
</body>
</html>
